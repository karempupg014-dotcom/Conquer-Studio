name: Extract C3 samples for format analysis

on:
  push:
    paths:
      - ".github/workflows/extract-c3-samples.yml"
      - "tools/c3_structure_probe.py"
      - "tools/c3_phy4_candidate_probe.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Conquer Studio tools
        uses: actions/checkout@v4

      - name: Download source game archive
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            "https://github.com/karempupg014-dotcom/Conquer-Studio/releases/download/v1.0/PATCH.1001.Naruto-Co.zip" \
            -o source.zip
          unzip -t source.zip >/dev/null
          mkdir extracted
          unzip -q source.zip -d extracted

      - name: Copy selected samples and create binary report
        shell: bash
        run: |
          set -euo pipefail
          ROOT="extracted/PATCH [1001] Naruto-Co"
          mkdir -p samples/c3/monster/100 samples/c3/Mount/809 samples/c3/mesh/x/garment reports
          cp -a "$ROOT/c3/monster/100/." samples/c3/monster/100/
          cp -a "$ROOT/c3/Mount/809/8090000.C3" "$ROOT/c3/Mount/809/8090000.dds" samples/c3/Mount/809/
          cp -a "$ROOT/c3/mesh/x/garment/001183485.C3" samples/c3/mesh/x/garment/
          python3 - <<'PY'
          from pathlib import Path
          import struct, re
          out = []
          for p in sorted(Path("samples").rglob("*")):
              if not p.is_file():
                  continue
              b = p.read_bytes()
              out.append(f"FILE: {p.as_posix()}\nSIZE: {len(b)} bytes\n")
              out.append("FIRST_512_HEX:\n" + " ".join(f"{x:02x}" for x in b[:512]) + "\n")
              strings = []
              for m in re.finditer(rb"[ -~]{5,}", b):
                  s = m.group().decode("ascii", "replace")
                  if len(s) > 160: s = s[:160] + "..."
                  strings.append(f"0x{m.start():08x}: {s}")
                  if len(strings) >= 100: break
              out.append("PRINTABLE_STRINGS:\n" + ("\n".join(strings) if strings else "(none)") + "\n")
              if p.suffix.lower() == ".dds" and len(b) >= 128 and b[:4] == b"DDS ":
                  h = struct.unpack_from("<7I", b, 4)
                  out.append(f"DDS_HEADER: size={h[0]} flags=0x{h[1]:08x} height={h[2]} width={h[3]} pitch_or_linear={h[4]} depth={h[5]} mipmaps={h[6]}\n")
              out.append("\n" + "="*90 + "\n\n")
          Path("reports/c3-sample-analysis.txt").write_text("".join(out), encoding="utf-8")
          PY
          (cd samples && zip -qr ../conquer-c3-samples.zip .)
          zip -q conquer-c3-analysis.zip reports/c3-sample-analysis.txt

      - name: Run conservative C3 structure probe
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find samples -type f -iname '*.c3' -print0)
          python3 tools/c3_structure_probe.py "${files[@]}" --json reports/c3-structure.json
          python3 - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          rows = json.loads(Path("reports/c3-structure.json").read_text(encoding="utf-8"))
          counts = Counter()
          lines = ["C3 STRUCTURE PROBE SUMMARY", f"Files scanned: {len(rows)}", ""]
          for row in rows:
              for marker in row["markers"]:
                  counts[marker["tag"]] += 1
              lines.append(f'{Path(row["file"]).name}: root={row["root_type"]}, tagged markers={len(row["markers"])}')
          lines += ["", "Tagged marker counts:"]
          lines += [f"{tag}: {count}" for tag, count in sorted(counts.items())]
          lines += ["", "Important: this is structural reconnaissance only; vertex/index and animation decoding are not yet validated."]
          Path("reports/c3-structure-summary.txt").write_text("\n".join(lines) + "\n", encoding="utf-8")
          print("\n".join(lines))
          PY
          zip -q conquer-c3-structure-report.zip reports/c3-structure.json reports/c3-structure-summary.txt

      - name: Run experimental PHY4 candidate probe
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find samples -type f -iname '*.c3' -print0)
          python3 tools/c3_phy4_candidate_probe.py "${files[@]}" --json reports/phy4-candidates.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          rows = json.loads(Path("reports/phy4-candidates.json").read_text(encoding="utf-8"))
          total = accepted = index_candidates = 0
          lines = ["EXPERIMENTAL PHY4 CANDIDATE SUMMARY", f"Files scanned: {len(rows)}", ""]
          for row in rows:
              sections = row.get("phy4_sections", [])
              total += len(sections)
              good = [s for s in sections if s.get("candidate")]
              accepted += len(good)
              idx = [s for s in good if s.get("candidate_index_buffer", {}).get("recognized")]
              index_candidates += len(idx)
              lines.append(f'{Path(row["file"]).name}: PHY4 sections={len(sections)}, 40-byte candidates={len(good)}, heuristic index candidates={len(idx)}')
              for section in good:
                  ib = section.get("candidate_index_buffer", {})
                  lines.append(f'  offset={section["offset"]} name={section["name"]} vertices={section["vertex_count"]} stride={section["candidate_stride"]} index_candidate={ib.get("recognized", False)} index_count={ib.get("count", "unknown")}')
          lines += ["", f"PHY4 sections total: {total}", f"Candidate 40-byte sections: {accepted}", f"Heuristic index-buffer candidates: {index_candidates}", "", "WARNING: candidate fields and topology are not fully decoded. This report is experimental only."]
          Path("reports/phy4-candidate-summary.txt").write_text("\n".join(lines) + "\n", encoding="utf-8")
          print("\n".join(lines))
          PY
          zip -q conquer-c3-phy4-candidate-report.zip reports/phy4-candidates.json reports/phy4-candidate-summary.txt

      - name: Upload sample files
        uses: actions/upload-artifact@v4
        with:
          name: conquer-c3-samples
          path: conquer-c3-samples.zip
          retention-days: 14

      - name: Upload binary analysis report
        uses: actions/upload-artifact@v4
        with:
          name: conquer-c3-analysis
          path: conquer-c3-analysis.zip
          retention-days: 14

      - name: Upload structural probe report
        uses: actions/upload-artifact@v4
        with:
          name: conquer-c3-structure-report
          path: conquer-c3-structure-report.zip
          retention-days: 14

      - name: Upload experimental PHY4 report
        uses: actions/upload-artifact@v4
        with:
          name: conquer-c3-phy4-candidate-report
          path: conquer-c3-phy4-candidate-report.zip
          retention-days: 14
