name: Windows desktop GUI smoke test

on:
  push:
    paths:
      - "conquer_studio/**"
      - "tests/test_gui_smoke.py"
      - "pyproject.toml"
      - ".github/workflows/gui-windows.yml"
  pull_request:
    paths:
      - "conquer_studio/**"
      - "tests/test_gui_smoke.py"
      - "pyproject.toml"
      - ".github/workflows/gui-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gui-smoke:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and desktop dependencies
        run: python -m pip install -e ".[gui]"
      - name: Compile modules
        run: python -m compileall -q conquer_studio tests
      - name: Run desktop GUI smoke test
        run: python -m unittest discover -s tests -p "test_gui_smoke.py" -v
