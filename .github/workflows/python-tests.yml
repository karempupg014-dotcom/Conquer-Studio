name: Conquer Studio Python tests

on:
  push:
    paths:
      - "conquer_studio/**"
      - "tests/**"
      - "tools/build_asset_catalog.py"
      - "tools/wdf_tool.py"
      - ".github/workflows/python-tests.yml"
  pull_request:
    paths:
      - "conquer_studio/**"
      - "tests/**"
      - "tools/build_asset_catalog.py"
      - "tools/wdf_tool.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python modules
        run: python -m compileall -q conquer_studio tools tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
