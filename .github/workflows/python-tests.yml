name: Conquer Studio Python tests

on:
  push:
    paths:
      - "conquer_studio/**"
      - "tools/wdf_audit.py"
      - "tools/build_asset_catalog.py"
      - "tools/wdf_tool.py"
      - "tools/dds_to_png.py"
      - "docs/DDS_TEXTURES.md"
      - "README.md"
      - "tests/**"
      - ".github/workflows/python-tests.yml"
  pull_request:
    paths:
      - "conquer_studio/**"
      - "tools/wdf_audit.py"
      - "tools/build_asset_catalog.py"
      - "tools/wdf_tool.py"
      - "tests/**"
      - ".github/workflows/python-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python modules
        run: python -m compileall -q conquer_studio tools tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Identify payload types in real WDF archives
        run: python tools/wdf_audit.py garments.wdf garments2.wdf
      - name: Validate real WDF archives in repository
        run: |
          python - <<'PY'
          from pathlib import Path
          from collections import Counter
          from conquer_studio.wdf import WDFArchive
          archives = sorted(Path(".").rglob("*.wdf"))
          if not archives:
              print("No repository WDF archives found; skipping real-archive validation.")
          for path in archives:
              if any(part in {".git", ".venv", "node_modules"} for part in path.parts):
                  continue
              archive = WDFArchive.open(path)
              ids = [entry.file_id for entry in archive.entries]
              sizes = [entry.size for entry in archive.entries]
              duplicate_ids = sum(count - 1 for count in Counter(ids).values() if count > 1)
              print(
                  f"VALID WDF: {path} | bytes={archive.file_size} "
                  f"| entries={len(archive.entries)} | index_offset={archive.index_offset} "
                  f"| duplicate_ids={duplicate_ids} | total_payload_bytes={sum(sizes)}"
              )
          PY
